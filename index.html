<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5fc4f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KopiGolf">
<title>KopiGolf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800&family=Lilita+One&display=swap">
<link rel="stylesheet" href="styles.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<!-- BODY START -->
<main id="stage" aria-label="KopiGolf">
  <canvas id="scene" aria-hidden="true"></canvas>

  <div class="hud">
    <header class="hud-top">
      <div class="badge" role="status" aria-live="polite">
        <span class="badge-num" id="hole-num" aria-hidden="true">1</span>
        <span class="badge-text">
          <span class="badge-name" id="hole-name">Loading</span>
          <span class="badge-meta" id="hole-meta"></span>
        </span>
        <span class="visually-hidden" id="hole-sr"></span>
      </div>
      <button class="hud-btn" id="btn-map" type="button" aria-label="Course map" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20z"/><path d="M9 4v13.5M15 6.5V20"/></svg>
      </button>
    </header>

    <div class="hud-mid">
      <button class="hud-btn" id="btn-look" type="button" aria-label="Look toward the pin" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><rect x="4.5" y="4" width="5.5" height="8" rx="1.6"/><rect x="14" y="4" width="5.5" height="8" rx="1.6"/><rect x="9" y="8.5" width="6" height="3.5" rx="1"/><circle cx="7" cy="15.5" r="4.6"/><circle cx="17" cy="15.5" r="4.6"/><circle cx="7" cy="15.5" r="2.1" fill="rgba(0,0,0,.28)"/><circle cx="17" cy="15.5" r="2.1" fill="rgba(0,0,0,.28)"/></svg>
      </button>
    </div>

    <div class="hud-bottom" aria-hidden="true">
      <svg class="swing-hint" viewBox="0 0 32 16" width="40" height="20"><path d="M4 4l12 8 12-8" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>

  <div class="map-sheet" id="map-sheet" hidden>
    <div class="map-panel" role="dialog" aria-modal="true" aria-labelledby="map-title">
      <div class="map-head">
        <div>
          <p class="map-kicker" id="map-kicker">Hole 1</p>
          <h2 class="map-title" id="map-title">Course map</h2>
        </div>
        <button class="close-btn" id="btn-map-close" type="button" aria-label="Close map">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <canvas id="map-canvas" aria-label="Overhead view of the hole"></canvas>
      <p class="map-legend"><span class="dot dot-tee"></span>Tee <span class="dot dot-pin"></span>Pin <span class="map-dist" id="map-dist"></span></p>
    </div>
  </div>

  <div class="loading" id="loading">
    <p class="loading-text">Teeing up…</p>
  </div>
</main>
<script>
  // If the 3D engine can't be fetched (offline, blocked CDN), say so instead of spinning forever.
  window.__kgFail = setTimeout(function () {
    var l = document.getElementById('loading');
    if (l) { l.classList.add('is-error'); l.querySelector('.loading-text').textContent = "Couldn't load the 3D engine. Check your connection, then reload."; }
  }, 15000);
</script>
<!-- BODY END -->
<script type="module" src="src/main.js"></script>
</body>
</html>
